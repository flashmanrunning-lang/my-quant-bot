name: CI dry run (no commit)

on:
  push:
    branches: [ci-dry-run]     # only this throwaway branch; the real 3-hour job lives on main

permissions:
  contents: read               # read-only: this run can never change the repo

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash            # bash with pipefail, so `| tee` cannot hide a failure
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Libraries
      run: pip install -r requirements.txt

    - name: Download Market Data
      run: python fetch_data.py data 2>&1 | tee fetch.log

    - name: Build C++ Engine
      run: g++ -std=c++17 -O2 -Wall -Wextra -o quantbot cpp/quantbot.cpp

    - name: Run Trading Strategy
      run: ./quantbot --data-dir data 2>&1 | tee run.log

    - name: Redraw Performance Chart
      run: python plot_chart.py

    - name: Report results as annotations
      if: always()
      run: |
        echo "::notice title=1 fetch::$(grep -E 'FAIL|tickers written' fetch.log 2>/dev/null | tr '\n' ' ')"
        echo "::notice title=2 engine::$(tail -n 14 run.log 2>/dev/null | tr '\n' '|')"
        echo "::notice title=3 ledger::$(tr '\n' '|' < portfolio_ledger.csv 2>/dev/null)"
        echo "::notice title=4 perf::$(head -1 alpha_performance.csv 2>/dev/null)|$(tail -n 3 alpha_performance.csv 2>/dev/null | tr '\n' '|')"
        echo "::notice title=5 baseline::$(tr -d '\n ' < benchmark_baseline.json 2>/dev/null | cut -c1-700)"
        echo "::notice title=6 chart::$(ls -la performance_chart.png 2>&1)"
