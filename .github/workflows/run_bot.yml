name: Run 3-Hour Quant Bot

on:
  schedule:
    - cron: '0 */3 * * *'      # Runs automatically every 3 hours
  workflow_dispatch:          # Allows manually clicking a button to run it instantly

permissions:
  contents: write             # Required so GitHub Actions can save changes back to your CSV file

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        pip install pandas numpy yfinance matplotlib

    - name: Run Trading Strategy
      run: |
        python main.py

    - name: Save Wallet Updates
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # The line below checks if performance_chart.png exists before trying to add it
        git add portfolio_ledger.csv alpha_performance.csv
        if [ -f performance_chart.png ]; then git add performance_chart.png; fi
        git commit -m "Update metrics logs and performance dashboard image [skip ci]" || echo "No changes to commit"
        git push
