name: Run 3-Hour Quant Bot

on:
  schedule:
    # FIX: Run every 3 hours (at minute 0 of hours 0, 3, 6, 9, 12, 15, 18, 21)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    # OPTIMIZATION: Updated to latest v4 action for node20 compatibility
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # OPTIMIZATION: Updated to latest v5 action
    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # OPTIMIZATION: Caches pip dependencies to speed up the run
        cache: 'pip'

    - name: Install Libraries
      run: |
        pip install pandas numpy yfinance matplotlib

    - name: Run Trading Strategy
      run: |
        python main.py

    # FIX: Securely push your changes without authentication failures
    - name: Save Wallet Updates
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add portfolio_ledger.csv alpha_performance.csv
        if [ -f performance_chart.png ]; then git add performance_chart.png; fi
        git commit -m "Update metrics logs and performance dashboard image [skip ci]" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref }}
